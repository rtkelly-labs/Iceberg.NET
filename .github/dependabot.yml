version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dotnet-platform:
        patterns:
          - Microsoft.EntityFrameworkCore*
          - Microsoft.AspNetCore.*
          - Microsoft.Extensions.*
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /interop
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
