[project]
name = "iceberg-net-interop"
version = "0.0.0"
description = "Reference implementations (PyIceberg, moto) used by the .NET Iceberg port's interop and emulation tests"
requires-python = ">=3.12"
dependencies = [
  "pyiceberg[pyarrow,glue,sql-sqlite,pyiceberg-core,s3fs]==0.12.0",
  "moto[server]==5.2.4",
  "datasketches==5.2.0",
  "pyroaring==1.2.0",
]

[tool.uv]
package = false

[dependency-groups]
# interop/duckdb_oracle.py (DuckDB's iceberg extension as an oracle): `uv sync --project interop --group duckdb`.
# The extension itself is downloaded by DuckDB on first use; offline, also install duckdb-extensions,
# duckdb-extension-iceberg and duckdb-extension-avro at the same version (see docs/spark-and-athena.md).
duckdb = ["duckdb==1.5.5"]
