# Trino's Iceberg connector against the same REST fixture + moto S3 the .NET suite writes to (see docker-compose.yml).
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://rest:8181
iceberg.rest-catalog.warehouse=s3://iceberg-regression/rest-warehouse
fs.native-s3.enabled=true
s3.endpoint=http://moto:5000
s3.path-style-access=true
s3.region=eu-west-1
s3.aws-access-key=test
s3.aws-secret-key=test
