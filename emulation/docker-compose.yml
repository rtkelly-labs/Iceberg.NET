# Full-emulation stack for the regression suite. See ../docs/regression-suite.md.
#   moto  - AWS emulator: S3 (incl. conditional writes) + Glue Data Catalog + STS, one endpoint,
#           started through moto_server.py so the Glue fidelity shims (docs/emulation.md) apply
#   rest  - apache/iceberg-rest-fixture: the Iceberg project's own REST catalog test server
#           (Java reference implementation, JDBC-backed) storing metadata in moto's S3
#   trino - (profile "trino": ./up.sh --trino) Trino's Iceberg connector over the same REST catalog + S3,
#           a third independent reader (Java, but not the Iceberg core library's scan planner)
name: iceberg-dotnet-emulation
services:
  moto:
    image: motoserver/moto:5.2.4
    ports: ["5000:5000"]
    volumes: ["./moto_server.py:/shim/moto_server.py:ro"]
    entrypoint: ["python", "-I", "/shim/moto_server.py", "--port", "5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/moto-api/')"]
      interval: 2s
      retries: 30

  bucket:
    image: motoserver/moto:5.2.4
    depends_on:
      moto: { condition: service_healthy }
    # Idempotent: moto may already hold the bucket when the stack is restarted.
    entrypoint: ["python", "-c", "import boto3; s3 = boto3.client('s3', endpoint_url='http://moto:5000', region_name='eu-west-1', aws_access_key_id='test', aws_secret_access_key='test'); s3.head_bucket(Bucket='iceberg-regression') if 'iceberg-regression' in [b['Name'] for b in s3.list_buckets()['Buckets']] else s3.create_bucket(Bucket='iceberg-regression', CreateBucketConfiguration={'LocationConstraint': 'eu-west-1'})"]

  rest:
    image: apache/iceberg-rest-fixture:1.10.0
    depends_on:
      bucket: { condition: service_completed_successfully }
    ports: ["8181:8181"]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      CATALOG_WAREHOUSE: s3://iceberg-regression/rest-warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://moto:5000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # The fixture's default in-memory SQLite fails concurrent commits with SQLITE_BUSY (HTTP 500), which the
      # soak tests surfaced. A file database with WAL and a busy timeout serialises writers instead.
      CATALOG_URI: "jdbc:sqlite:/tmp/rest-catalog.db?journal_mode=WAL&busy_timeout=30000"

  trino:
    image: trinodb/trino:478
    profiles: ["trino"]
    depends_on:
      rest: { condition: service_started }
    ports: ["8080:8080"]
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/jvm.config:/etc/trino/jvm.config:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/v1/info/state"]
      interval: 3s
      retries: 60
